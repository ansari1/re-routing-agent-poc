server:
  port: ${ORDER_SERVICE_PORT:8081}

spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}

app:
  api:
    description: Order lifecycle service
  pagination:
    default-size: ${PAGE_DEFAULT_SIZE:20}
    max-size: ${PAGE_MAX_SIZE:100}
  cache:
    ttl: ${CACHE_TTL:5m}
    maximum-size: ${CACHE_MAX_SIZE:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
