server:
  port: ${DELIVERY_SERVICE_PORT:8085}

spring:
  application:
    name: delivery-service
  datasource:
    url: ${DELIVERY_DB_URL:jdbc:h2:mem:delivery;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}

app:
  api:
    description: Shipment booking with weather-aware delivery
  delivery:
    weather:
      severe: ${WEATHER_SEVERE:false}
      affected-regions: ${WEATHER_AFFECTED_REGIONS:SOUTH_ENGLAND}
  pagination:
    default-size: ${PAGE_DEFAULT_SIZE:20}
    max-size: ${PAGE_MAX_SIZE:100}
  cache:
    ttl: ${CACHE_TTL:5m}
    maximum-size: ${CACHE_MAX_SIZE:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
